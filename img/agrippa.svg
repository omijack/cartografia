<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Agrippa</title><desc id="d">Pantalla verda amb text que s'esvaeix.</desc>
  <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8dffc1"/><stop offset="1" stop-color="#8dffc1" stop-opacity="0"/></linearGradient></defs>
