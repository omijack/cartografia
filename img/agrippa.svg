  <g fill="url(#fade)" font-family="monospace" font-size="31"><text x="180" y="190">I hesitated before untying the ribbon</text><text x="180" y="250">that held the book closed.</text><text x="180" y="350">memory / machine / disappearance</text><text x="180" y="450">01000001 01000111 01010010</text><text x="180" y="550">the words leave their surface</text><text x="180" y="650">and cannot be read twice</text></g>
  <text x="600" y="845" text-anchor="middle" fill="#8dffc1" font-family="monospace" font-size="65">AGRIPPA_</text>
